name: UADS quality
on:
  workflow_dispatch:
  pull_request:
    branches: [testing, beta, main]
concurrency:
  group: uads-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run uads:validate
      - run: npm audit --omit=dev --audit-level=high
  functional:
    uses: ./.github/workflows/checks.yml
